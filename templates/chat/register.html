<!DOCTYPE html>
<html>
<head>
    <title>Register - ChatFlow</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background: linear-gradient(135deg, #ECE5DD 0%, #D1D7DB 100%);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 20px;
        }
        .card {
            background: white; padding: 40px 36px; border-radius: 16px;
            width: 100%; max-width: 400px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }
        .logo { text-align: center; margin-bottom: 24px; }
        .logo-icon { font-size: 42px; color: #128C7E; margin-bottom: 8px; }
        h2 { margin: 0 0 6px; color: #075E54; font-size: 24px; text-align: center; }
        .subtitle { color: #667781; font-size: 13px; text-align: center; margin-bottom: 28px; line-height: 1.5; }
        label {
            display: block; font-size: 12px; color: #667781;
            margin-top: 16px; margin-bottom: 6px;
            text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600;
        }
        input {
            width: 100%; padding: 12px 14px;
            border: 1.5px solid #E9EDEF; border-radius: 10px;
            font-size: 15px; outline: none; box-sizing: border-box;
            transition: border-color 0.15s; font-family: inherit;
        }
        input:focus { border-color: #128C7E; }
        .handle-input { position: relative; }
        .handle-prefix {
            position: absolute; left: 14px; top: 50%;
            transform: translateY(-50%); color: #128C7E;
            font-weight: 600; font-size: 16px; pointer-events: none;
        }
        .handle-input input { padding-left: 32px; }
        .hint { font-size: 11.5px; color: #8696A0; margin-top: 5px; }
        button {
            width: 100%; padding: 13px;
            background: #128C7E; color: white; border: none;
            border-radius: 10px; font-size: 15px; font-weight: 600;
            cursor: pointer; margin-top: 26px; transition: background 0.15s;
            font-family: inherit;
        }
        button:hover { background: #075E54; }
        .error {
            background: #FFEBEE; color: #C62828;
            padding: 11px 14px; border-radius: 10px;
            font-size: 13px; margin-bottom: 16px;
            display: flex; align-items: center; gap: 8px;
        }
        .link { text-align: center; margin-top: 20px; font-size: 13.5px; color: #667781; }
        .link a { color: #128C7E; text-decoration: none; font-weight: 600; }
        .link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <div class="logo-icon"><i class="fas fa-comment-dots"></i></div>
            <h2>Create your account</h2>
            <div class="subtitle">Choose a unique <b>@handle</b> so friends can find you easily</div>
        </div>

        {% if error %}
        <div class="error"><i class="fas fa-exclamation-circle"></i> {{ error }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label>Username</label>
            <input type="text" name="username" required autocomplete="off"
                   placeholder="Your display name">

            <label>Handle</label>
            <div class="handle-input">
                <span class="handle-prefix">@</span>
                <input type="text" name="handle" required autocomplete="off"
                       placeholder="suriya"
                       pattern="[a-z0-9_]{3,30}"
                       title="3-30 characters. Only lowercase letters, numbers, underscore."
                       maxlength="30">
            </div>
            <div class="hint">Lowercase letters, numbers, and _ only. Must be unique.</div>

            <label>Password</label>
            <input type="password" name="password" required minlength="6"
                   placeholder="Min 6 characters">

            <button type="submit">Sign up <i class="fas fa-arrow-right" style="margin-left:6px;"></i></button>
        </form>

        <div class="link">Already have an account? <a href="/login/">Login</a></div>
    </div>
</body>
</html>
